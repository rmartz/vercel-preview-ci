name: 'Setup'
description: "Install pnpm, Node.js, and this repo's dev dependencies (for this repo's own CI only)"

# Used only by this repo's own CI. The reusable vercel-preview.yml cannot use it:
# a reusable workflow's `uses: ./…` resolves against the CALLER's checkout.
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
      shell: bash
