name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Reject a [WIP] marker anywhere in the title (case-insensitive). A
          # work-in-progress PR must not be mergeable; removing the marker (a title
          # edit re-runs this check) is what lets CI go green. The bracketed form
          # avoids false positives on "WIP" appearing inside a word.
          if printf '%s\n' "$PR_TITLE" | grep -qiE '\[wip\]'; then
            echo "PR title still carries a [WIP] marker: $PR_TITLE"
            echo "Remove [WIP] before merging — a work-in-progress PR must not be mergeable."
            exit 1
          fi
          # Reject a '!' breaking-change marker on a non-functional type. Under the
          # conventionalcommits preset, '!' forces a *major* release regardless of
          # type, so it is only meaningful on a type that changes functionality
          # (feat, fix, perf, revert). A non-functional type (docs, chore,
          # refactor, test, style, ci, build) does not describe a behavior change,
          # so a '!' on it is either a mistake or would silently promote a
          # non-change to a major bump. Grammar note: this specific message must
          # fire before the generic format check below, whose core regex (mirrored
          # in commit-convention.yml) also rejects these — allowing '!' only on
          # feat/fix/perf/revert.
          if printf '%s\n' "$PR_TITLE" | grep -qE '^(docs|chore|refactor|test|style|ci|build)(\([^)]+\))?!: '; then
            echo "PR title puts a '!' breaking-change marker on a non-functional type: $PR_TITLE"
            echo "'!' may only be used with a type that changes functionality (feat, fix, perf, revert)."
            echo "A non-functional type (docs, chore, refactor, test, style, ci, build) does not describe a behavior change, so a breaking-change marker on it is meaningless — drop the '!'."
            exit 1
          fi
          if printf '%s\n' "$PR_TITLE" | grep -qE '^((feat|fix|perf|revert)(\([^)]+\))?!?|(docs|chore|refactor|test|style|ci|build)(\([^)]+\))?): [^[:space:]].*$'; then
            echo "PR title is valid: $PR_TITLE"
          else
            echo "PR title does not follow Conventional Commits format."
            echo "Expected: <type>[!]: description  or  <type>(<scope>)[!]: description"
            echo "Valid types: feat, fix, docs, chore, refactor, test, style, perf, ci, build, revert"
            echo "The '!' breaking-change marker is allowed only on feat, fix, perf, and revert."
            echo "Got: $PR_TITLE"
            exit 1
          fi
