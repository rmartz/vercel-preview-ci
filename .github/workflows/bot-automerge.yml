name: bot-automerge

# Consumer caller for rmartz/bot-automerge-action — enables GitHub-native
# auto-merge on trusted bot PRs (Dependabot patch/minor bumps, release-please
# release PRs). It posts no check-run and gates nothing itself: the actual merge
# still waits on this repo's required status checks (merge-safety + CI), which is
# why bot-automerge is adopted only after merge-safety is required on the default
# branch. SHA-pinned + Dependabot-bumped.
#
# This calls the composite ACTION, which supersedes @rmartz/bot-automerge's
# reusable workflow. A composite action cannot declare its own triggers, hold write
# scopes, or use `secrets: inherit`, so this caller carries the trigger, grants the
# write permissions, and passes the App token as an explicit input. The migration also
# drops the reusable workflow's per-PR `concurrency` group: GitHub allows only one
# PENDING run per group and cancels any it supersedes, so a burst of
# pull_request_target events (opening a PR and labelling it fires one each) left
# `cancelled` check-runs on the PR — a conclusion our automation reads as failing.
# Without a group nothing queues, so nothing is cancelled; the cost is a few
# redundant no-op runs, which the skip guard below makes nearly free.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of installing the CLI just to no-op. The two
    # conditions mirror the CLI's own detectBotPrType exactly — Dependabot by
    # author, release-please by head branch prefix — so nothing eligible is
    # skipped. The `autorelease: pending` label is not a signal: since
    # v2.0.0 the CLI ignores it, because anyone with triage permission can apply it
    # (rmartz/bot-automerge#41).
    # Note release-please's author is not predictable: release PRs are authored by
    # whichever identity release-please runs under, which is why this guard keys
    # off the `release-please--` branch rather than the author.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The App's Client ID and private key are stored as both Actions and
      # Dependabot secrets (a Dependabot-triggered run sees only the latter).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}
      - uses: rmartz/bot-automerge-action@6b23093a6cfd17cad6582cd68b2037eea5eeb4a6 # v2.2.1
        with:
          pr: ${{ github.event.pull_request.number }}
          # Installation token for the rmartz-merge-bot GitHub App. An auto-merge
          # enabled with GITHUB_TOKEN fires no push workflows, so a bot merge would
          # reach main with no push-triggered CI, release, or merge-safety run
          # (rmartz/bot-automerge-action#31). App-authored events do trigger push
          # workflows, and the App has its own rate-limit pool, so a coordinator
          # that exhausts the user's GraphQL quota cannot fail this job
          # (rmartz/scripts#22).
          token: ${{ steps.app-token.outputs.token }}
