name: pr-lifecycle
# Shows which event and action started each run (e.g. pull_request_target /
# review_request_removed), so the run list says what re-reconciled a PR.
run-name: pr-lifecycle (${{ github.event_name }}${{ github.event.action && format('/{0}', github.event.action) || '' }})

# Consumer caller for rmartz/pr-lifecycle-action: on every relevant event it
# recomputes each PR's lifecycle state, converges its labels, and arms
# GitHub-native auto-merge when the PR reaches `approved`, including an eligible
# Dependabot or release-please PR (this replaced bot-automerge.yml). With
# `auto-update` it brings an approved PR that merge-safety labels
# `update required` current with update-branch. A Dependabot PR is never
# updated: a person or Dependabot itself rebases it. SHA-pinned +
# Dependabot-bumped.
#
# SAFETY: auto-merge lands the moment the default-branch ruleset's required
# checks pass (Typecheck, Lint, Format, Test, hygiene, release-check,
# pr-policy, merge-safety). This is only safe while those checks are REQUIRED
# on main.
#
# Reads and label writes use the workflow's GITHUB_TOKEN. The action creates a
# real-actor token from the rmartz-pr-lifecycle App (the PR_LIFECYCLE_CLIENT_ID /
# PR_LIFECYCLE_PRIVATE_KEY secrets) for the writes that need one; until those
# secrets are set, it reconciles labels only.

on:
  # pull_request_target: Dependabot PRs get a read-only token under pull_request,
  # and labels need write. The action reads the PR over the API and never checks
  # out or runs PR code.
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - edited
      - labeled
      - unlabeled
      # A bot review request added (or removed by hand) after a run's settle
      # wait moves the PR into (or out of) awaiting-bot-review.
      - review_requested
      - review_request_removed
  pull_request_review:
    types: [submitted, dismissed, edited]
  # CI completion. check_suite never fires for suites GitHub Actions creates, so
  # workflow_run lists every Actions workflow behind a required check.
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [CI, Repo Hygiene, Release check, pr-policy, merge-safety]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to reconcile
        required: true

permissions:
  pull-requests: write # labels, review requests, advisory comment, disarming
  contents: read # branch rules, base head, commits for approval carry-over
  checks: read # the CI gate
  statuses: read # the CI gate
  actions: write # report a transient failure as a cancelled run

jobs:
  reconcile:
    name: Reconcile PR lifecycle
    # A review on a fork PR runs with a read-only token and no secrets, so it
    # cannot write labels; skip it rather than fail. The fork PR is reconciled on
    # its next pull_request_target event, or on demand via workflow_dispatch.
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One run per PR at a time; a newer event supersedes an in-flight run, since
    # every run recomputes the PR from its current facts. CI-completion events are
    # keyed by head SHA, as the PR number is only known inside the action.
    concurrency:
      group: >-
        pr-lifecycle-${{ github.event.pull_request.number || inputs.pr ||
        github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
      cancel-in-progress: true
    steps:
      - uses: rmartz/pr-lifecycle-action@675fe64a1c3f9a1fe474b19ab781b0c1347115cb # v4.4.3
        with:
          # The action creates its real-actor token from the rmartz-pr-lifecycle
          # App: it arms, merges, updates, and posts the pr-lifecycle/sign-off
          # status. Both are Actions and Dependabot secrets; until they are set,
          # the run reconciles labels only.
          app-client-id: ${{ secrets.PR_LIFECYCLE_CLIENT_ID }}
          app-private-key: ${{ secrets.PR_LIFECYCLE_PRIVATE_KEY }}
          # UAT is off for this repo by choice (see pr-policy.yml's skip-uat); the
          # reusable workflows it ships are still user-facing. Every PR is `no UAT
          # needed`. Quoted: YAML 1.1 reads a bare off as false.
          uat: 'off'
          arm-auto-merge: true
          auto-update: true
